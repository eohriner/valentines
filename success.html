<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Happy Valentine’s Day ❤️</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(120deg, #ff9a9e, #fad0c4);
      color: #fff;
      text-align: center;
      overflow: hidden;
      height: 100vh;
      position: relative;
    }
    .container {
      max-width: 500px;
      margin: 20vh auto;
      padding: 30px;
      border-radius: 20px;
      background: rgba(0,0,0,0.25);
    }
    .heart {
      position: absolute;
      color: pink;
      font-size: 20px;
      animation: float 6s infinite;
    }
    @keyframes float {
      0% { transform: translateY(100vh); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-10vh); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>❤️ Happy Valentine’s Day Love ❤️</h1>
    <p>
      You have successfully confirmed that you possess a heart.<br><br>
      I’ll see you at <strong>Kumoya</strong> for dinner 🌸
    </p>
  </div>

  <script>
    function spawnHearts() {
      setInterval(() => {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.innerHTML = '❤️';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.fontSize = (20 + Math.random() * 20) + 'px';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 6000);
      }, 300);
    }

    spawnHearts();
  </script>
</body>
</html>

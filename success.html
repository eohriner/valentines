<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Happy Valentine’s Day ❤️</title>
  <style>
    /* Full page and background */
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      color: #fff;
      text-align: center;
      overflow: hidden;
      height: 100vh;
      position: relative;
      /* Gradient + peony pattern */
      background: linear-gradient(120deg, #ff9a9e, #fad0c4),
                  url('https://i.ibb.co/r0D9s7x/peonies-pattern.png') repeat;
      background-size: 150px; /* size of the pattern */
    }

    /* Centered container box */
    .container {
      max-width: 700px; /* wider so text doesn't wrap */
      margin: 20vh auto;
      padding: 30px;
      border-radius: 20px;
      background: rgba(0,0,0,0.25);
    }

    /* H1 hearts line no-wrap */
    h1 span.nowrap {
      white-space: nowrap;
    }

    /* Floating hearts */
    .heart {
      position: absolute;
      font-size: 20px;
      animation: float 6s linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(100vh); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-10vh); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><span class="nowrap">❤️ Happy Valentine’s Day Love ❤️</span></h1>
    <p>
      Thank you for choosing me as your lucky valentine.<br><br>
      I’ll see you at <strong>Kumoya</strong> for dinner
    </p>
    <p>🍣🍣🍣🍣🍣</p>
  </div>

  <script>
    function spawnHearts() {
      const colors = ['#ff4d6d', '#ffccd5', '#ff6699']; // Pink / red tones only
      setInterval(() => {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.innerHTML = '❤️';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.fontSize = (20 + Math.random() * 20) + 'px';
        heart.style.color = colors[Math.floor(Math.random() * colors.length)];
        heart.style.transform = `rotate(${Math.random()*360}deg)`;
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 6000);
      }, 300);
    }

    spawnHearts();
  </script>
</body>
</html>

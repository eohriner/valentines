<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Happy Valentine’s Day ❤️</title>
  <style>
    /* Full-page body */
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      color: #fff;
      text-align: center;
      overflow: hidden;
      height: 100vh;
      position: relative;
      /* Full-screen background image */
      background: url('images/Peonies.jpeg') no-repeat center center fixed;
      background-size: cover;
    }

    /* Optional dark overlay to fade wallpaper a bit */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 105, 135, 0.35); /* pink tint with opacity */
      z-index: 0;
    }

    /* Centered container box */
    .container {
      position: relative; /* bring above overlay */
      z-index: 1;
      max-width: 700px;
      margin: 20vh auto;
      padding: 30px;
      border-radius: 20px;
      background: rgba(0,0,0,0.25);
    }

    /* H1 hearts line no-wrap */
    h1 span.nowrap {
      white-space: nowrap;
    }

    /* Floating hearts */
    .heart {
      position: absolute;
      font-size: 30px; /* base size, will randomize bigger */
      animation: float 6s linear infinite;
      z-index: 1;
    }

    @keyframes float {
      0% { transform: translateY(100vh); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-10vh); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><span class="nowrap">❤️ Happy Valentine’s Day Love ❤️</span></h1>
    <p>
      Thanks for picking me to be your lucky valentine!<br><br>
      I’ll see you at <strong>Kumoya</strong> for dinner
    </p>
    <p>🍣🍣🍣🍣🍣🍣🍣🍣🍣</p>
  </div>

  <script>
    function spawnHearts() {
      const colors = ['#ff4d6d', '#ffccd5', '#ff6699']; // Pink/red tones
      setInterval(() => {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.innerHTML = '❤️';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.fontSize = (50 + Math.random() * 30) + 'px'; // bigger hearts
        heart.style.color = colors[Math.floor(Math.random() * colors.length)];
        heart.style.transform = `rotate(${Math.random()*360}deg)`;
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 6000);
      }, 200); // faster spawn (every 0.2s)
    }

    spawnHearts();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Security Check ❤️</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(120deg, #ff9a9e, #fad0c4);
      color: #fff;
      text-align: center;
    }
    .container {
      max-width: 500px;
      margin: 20vh auto;
      background: rgba(0,0,0,0.25);
      padding: 30px;
      border-radius: 20px;
    }
    button {
      background: #ff4d6d;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 25px;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Security Check</h2>
    <p>Please confirm you are not a robot.</p>
    <button onclick="window.location.href='captcha.html'">I'm Not a Robot</button>
  </div>
</body>
</html>
